<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala</title>
    <link rel="stylesheet" href="../css/pizarra.css">
</head>
<body>
    <section class="contenedor-pizarra">

    <header class="encabezado-pizarra">
        <div>
            <h1>Pizarra colaborativa</h1>
            <p>Espacio de dibujo compartido</p>
        </div>
    </header>

    <div class="barra-herramientas">

        <div class="grupo-herramientas">

            <button id="btnLapiz" class="herramienta activa">
                Lápiz
            </button>

            <button id="btnBorrador" class="herramienta">
                Borrador
            </button>

        </div>

        <div class="grupo-herramientas">
            <label>Colores:</label>

            <button class="color-opcion seleccionado"
                data-color="#000000"
                style="background-color: #000000;"
                title="Negro">
            </button>

            <button class="color-opcion"
                data-color="#ef4444"
                style="background-color: #ef4444;"
                title="Rojo">
            </button>

            <button class="color-opcion"
                data-color="#3b82f6"
                style="background-color: #3b82f6;"
                title="Azul">
            </button>

            <button class="color-opcion"
                data-color="#22c55e"
                style="background-color: #22c55e;"
                title="Verde">
            </button>

            <button class="color-opcion"
                data-color="#eab308"
                style="background-color: #eab308;"
                title="Amarillo">
            </button>

            <div class="selector-personalizado">
                <label for="colorLapiz" title="Elegir otro color">
                    +
                </label>
                <input type="color" id="colorLapiz" value="#000000">
            </div>

        </div>

            <label for="grosorLapiz">Grosor:</label>
            <input
                type="range"
                id="grosorLapiz"
                min="1"
                max="30"
                value="4"
            >

            <span id="valorGrosor">4 px</span>

        </div>

        <div class="grupo-herramientas">

            <button id="btnLimpiar" class="btn-limpiar">
                Limpiar pizarra
            </button>

        </div>

    </div>

    <div class="contenedor-canvas">
        <canvas id="pizarraCanvas"></canvas>
    </div>

</section>

<script src="../javascripts/pizarra.js" defer></script>

</body>
</html>
