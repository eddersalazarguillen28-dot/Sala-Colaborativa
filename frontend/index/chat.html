<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat - Sala Colaborativa</title>

    <link rel="stylesheet" href="../css/chat.css">

</head>

<body>

    <main class="contenedor-chat">

        <header class="encabezado-chat">

            <h1>Chat de la sala</h1>

            <p>Sala de trabajo colaborativa</p>

            <p id="nombreSalaActual"></p>

            <p id="usuarioActual"></p>

        </header>

        <section class="contenido-chat">

            <!-- PARTICIPANTES -->

            <aside class="participantes">

                <h2>Participantes</h2>

                <div
                    class="lista-participantes"
                    id="listaParticipantes">
                </div>

            </aside>

            <!-- CONVERSACIÓN -->

            <section class="conversacion">

                <div
                    class="mensajes"
                    id="mensajes">

                </div>

                <!-- FORMULARIO -->

                <form
                    class="formulario-mensaje"
                    id="formularioMensaje">

                    <input
                        type="text"
                        placeholder="Escribe un mensaje..."
                        id="mensaje"
                        autocomplete="off"
                        maxlength="2000"
                        required>

                    <button type="submit">
                        Enviar
                    </button>

                </form>

            </section>

        </section>

    </main>

    <!-- SOCKET.IO -->

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <!-- CONEXIÓN Y CHAT -->
    <!-- La inicialización global del socket se agregará
         cuando revisemos el archivo correspondiente. -->

    <script src="../javascripts/sala.js"></script>
    <script src="../javascripts/chat.js"></script>

</body>

</html>
